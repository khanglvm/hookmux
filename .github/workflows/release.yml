# Release flow: release-please keeps a release PR open from Conventional Commit
# messages on main. Merging it tags the release, and the publish job below
# ships that tag to npm through trusted publishing (OIDC), with no npm token.
#
# Setup, done once in Nov 2026: hookmux@0.1.0 was published by hand so the
# package existed, npm trusts this workflow (`npm trust list hookmux`), and
# GitHub Actions may open pull requests. Nothing else is needed per release:
# merge the release PR and the publish job ships it.
#
# Run the workflow by hand (Actions > release > Run workflow) to:
#   - dry-run:         build, test and pack without publishing (the default);
#   - verify-trust:    confirm npm still trusts this workflow, publishing nothing;
#   - publish-missing: publish main's package.json version if npm lacks it,
#                      built from that version's v* tag, e.g. after a publish
#                      job failed on a release.
# Manual runs work only from main; a run started on another branch skips publish.
# npm adds provenance on its own once the repository is public. Leave out
# --provenance and publishConfig.provenance: npm generates none from a private
# repository, and asking for it there has been reported to fail the publish.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: What a manual run does
        type: choice
        options: [dry-run, verify-trust, publish-missing]
        default: dry-run

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Separate job, so the write permissions above and id-token below never meet.
  publish:
    needs: release-please
    # !cancelled() lets a manual run go ahead while release-please is skipped.
    # A manual run gets the OIDC token only on main, never on a branch picked in the menu.
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # Node 24 bundles npm 11, which trusted publishing needs (11.5.1 or later).
      # No dependency cache in a publish job: a poisoned cache could reach the OIDC token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm trusts this workflow
        if: ${{ inputs.mode == 'verify-trust' }}
        run: node .github/scripts/verify-npm-trust.mjs
      # Skips a version npm already has, so a re-run never fails on E403.
      - name: Check the registry
        id: registry
        if: ${{ inputs.mode != 'verify-trust' }}
        run: |
          spec="$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')"
          if out="$(npm view "$spec" version --registry=https://registry.npmjs.org/ 2>&1)"; then
            echo "$spec is already on npm; nothing to publish."
            echo "missing=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -q E404; then
            echo "$spec is not on npm yet."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$out" >&2
            exit 1
          fi
      # main may hold commits made after the release; ship exactly the tagged release.
      - name: Check out the release tag
        if: ${{ steps.registry.outputs.missing == 'true' && inputs.mode == 'publish-missing' }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          git fetch --no-tags --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          git checkout --detach "$tag"
      # A dry run builds and tests even when npm already has the version.
      - if: ${{ steps.registry.outputs.missing == 'true' || inputs.mode == 'dry-run' }}
        run: pnpm install --frozen-lockfile
      - if: ${{ steps.registry.outputs.missing == 'true' || inputs.mode == 'dry-run' }}
        run: pnpm build
      - if: ${{ steps.registry.outputs.missing == 'true' || inputs.mode == 'dry-run' }}
        run: pnpm test
      - if: ${{ steps.registry.outputs.missing == 'true' || inputs.mode == 'dry-run' }}
        run: pnpm smoke
      - if: ${{ steps.registry.outputs.missing == 'true' || inputs.mode == 'dry-run' }}
        run: node .github/scripts/check-package.mjs
      # npm, not pnpm: npm's OIDC support is documented; pnpm's is not.
      - name: Publish with npm trusted publishing
        if: ${{ steps.registry.outputs.missing == 'true' && (github.event_name == 'push' || inputs.mode == 'publish-missing') }}
        run: npm publish --access public
