# Weekly grouped updates. The 7-day cooldown matches minimumReleaseAge in
# pnpm-workspace.yaml, so Dependabot never proposes a version pnpm would refuse.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # @types/node follows the oldest supported Node (engines >=22), so newer
    # majors would type-check APIs that Node 22 users do not have.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
        patterns: ["*"]
